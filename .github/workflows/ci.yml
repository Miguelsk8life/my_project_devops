name: Java CI/CD and Docker Packaging with Telegram Alerts
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: miguelsk8life/my_project_devops

jobs:
  build-and-pack:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    defaults:
      run:
        working-directory: app

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'


      - name: Build with Maven
        run: mvn -B package --file pom.xml


      - name: Build Docker Image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest


      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Push Docker Image to GHCR
        if: github.event_name == 'push'
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest


      - name: Update Kubernetes manifest with new image tag
        if: github.event_name == 'push'
        working-directory: .
        run: |
          sed -i "s|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|" k8s/app-deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/app-deployment.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit (image tag already up to date)."
          else
            git commit -m "chore: update web-app image to ${{ github.sha }} [skip ci]"
            git push
          fi


      - name: Send Telegram Notification on Success
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 CI/CD Pipeline Success!
            📌 Repository: ${{ github.repository }}
            🌿 Branch: ${{ github.ref_name }}
            📝 Commit: "${{ github.event.head_commit.message }}"
            ✅ The project compiled successfully and the Docker image is ready for deployment.


      - name: Send Telegram Notification on Failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ❌ CI/CD Pipeline Failed!
            📌 Repository: ${{ github.repository }}
            🌿 Branch: ${{ github.ref_name }}
            ⚠️ An error occurred during the compilation or Docker packaging phase. Please check the GitHub Actions logs.