apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: devops-portfolio
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alloy-logs-reader
  namespace: devops-portfolio
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alloy-logs-reader-binding
  namespace: devops-portfolio
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: devops-portfolio
roleRef:
  kind: Role
  name: alloy-logs-reader
  apiGroup: rbac.authorization.k8s.io
